services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: kino
      POSTGRES_USER: kino
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kino -d kino"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: